<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=overlays-content">
<meta name="theme-color" content="#140a24">
<title>Plezy Retrowave remote</title>
<style>
  :root { --bg:#140a24; --panel:#22123a; --line:#4a2a74; --accent:#ec4899; --text:#f4ecff; --muted:#a990c9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; height:100dvh; overflow:hidden; background:var(--bg); color:var(--text);
    font:15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; gap:6px; padding:8px; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:8px; min-height:22px; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
  #dot.on { background:#34d399; }
  #page { flex:1; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { display:flex; gap:6px; flex:none; }
  input, #msg, header { flex:none; }
  button { flex:1; min-height:38px; border:1px solid var(--line); border-radius:10px; background:var(--panel);
    color:var(--text); font:inherit; font-size:14px; padding:0 6px; }
  button:active { border-color:var(--accent); background:#3a1d5c; }
  button.accent { border-color:var(--accent); }
  #pad { flex:1 1 auto; min-height:120px; border:1px solid var(--line); border-radius:16px; position:relative;
    background:radial-gradient(circle at 50% 40%, #2a1647, var(--panel)); touch-action:none; user-select:none; }
  #pad span { position:absolute; inset:auto 0 12px 0; text-align:center; color:var(--muted); font-size:12px; pointer-events:none; }
  input { width:100%; min-height:38px; border:1px solid var(--line); border-radius:10px; background:var(--panel);
    color:var(--text); font:inherit; padding:0 12px; }
  input:focus { outline:none; border-color:var(--accent); }
  #msg { color:#fca5a5; font-size:13px; min-height:0; }
  form.row input { flex:1; min-width:0; }
  #bar { position:absolute; top:10px; bottom:10px; right:14px; width:40px; touch-action:none; }
  #bar i { position:absolute; top:0; bottom:0; right:18px; width:3px; border-radius:2px; background:var(--line); }
  #bar.on i { background:var(--accent); }
  #dpad { flex:none; display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; width:min(100%, 280px); margin:0 auto; }
  #dpad button { min-height:50px; font-size:18px; }
  button.small { flex:none; min-width:64px; }
</style>
</head>
<body>
<header><div id="dot"></div><div id="page">Connecting…</div></header>
<div id="msg"></div>
<form id="addressForm" class="row" autocomplete="off" novalidate>
  <input id="address" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" spellcheck="false" placeholder="Address or search">
  <button id="open" type="submit" class="accent small">Open</button>
</form>
<form id="textForm" class="row" autocomplete="off" novalidate>
  <input id="text" type="text" enterkeyhint="send" autocapitalize="off" spellcheck="false" placeholder="Type into the selected field">
  <button id="type" type="submit" class="small">Type</button>
</form>
<div class="row">
  <button data-key="Backspace">⌫</button>
  <button data-key="Tab" id="nextField">Next field ⇥</button>
  <button data-key="Enter" class="accent">Enter ⏎</button>
</div>
<div class="row">
  <button data-nav="back">◀ Back</button>
  <button data-nav="forward">Forward ▶</button>
  <button data-nav="reload">⟳ Reload</button>
</div>
<div id="pad"><span id="hint">Move: one finger · Click: tap · Scroll: two fingers or the bar on the right</span><div id="bar"><i></i></div></div>
<div id="dpad">
  <span></span><button data-dpad="up">▲</button><span></span>
  <button data-dpad="left">◀</button><button data-dpad="ok" class="accent">OK</button><button data-dpad="right">▶</button>
  <span></span><button data-dpad="down">▼</button><span></span>
</div>
<script>
(function () {
  var key = new URLSearchParams(location.search).get('k') || '';
  var de = (navigator.language || '').toLowerCase().indexOf('de') === 0;
  if (de) {
    var t = { back:'◀ Zurück', forward:'Vor ▶', reload:'⟳ Neu laden' };
    // The bar on the right: one finger along it scrolls the page.
  var bar = document.getElementById('bar');
  var barY = null;
  bar.addEventListener('pointerdown', function (e) {
    e.stopPropagation();
    // Only a fresh touch on the bar scrolls: not while a finger is
    // already moving the pointer on the touchpad.
    if (Object.keys(points).length > 0) return;
    bar.setPointerCapture(e.pointerId);
    barY = e.clientY;
    bar.className = 'on';
  });
  bar.addEventListener('pointermove', function (e) {
    e.stopPropagation();
    if (barY === null) return;
    // Like a scroll bar: down moves the page down (the content up).
    sy -= (e.clientY - barY) * 2;
    barY = e.clientY;
  });
  function barUp(e) { e.stopPropagation(); barY = null; bar.className = ''; }
  bar.addEventListener('pointerup', barUp);
  bar.addEventListener('pointercancel', barUp);

  document.querySelectorAll('[data-nav]').forEach(function (b) { b.textContent = t[b.dataset.nav]; });
    document.getElementById('hint').textContent = 'Bewegen: ein Finger · Klicken: tippen · Scrollen: zwei Finger oder die Leiste rechts';
    document.getElementById('address').placeholder = 'Adresse oder Suche';
    document.getElementById('text').placeholder = 'In das gewählte Feld tippen';
    document.getElementById('type').textContent = 'Tippen';
    document.getElementById('open').textContent = 'Öffnen';
    document.getElementById('nextField').textContent = 'Nächstes Feld ⇥';
    document.documentElement.lang = 'de';
  }
  var msg = document.getElementById('msg');
  var dot = document.getElementById('dot');
  var page = document.getElementById('page');
  var queue = [];
  var dx = 0, dy = 0, sx = 0, sy = 0;
  var sending = false;

  function post(events) {
    return fetch('/e?k=' + encodeURIComponent(key), { method:'POST', body:JSON.stringify(events), keepalive:true })
      .then(function (r) {
        if (r.status === 403) { msg.textContent = de ? 'Nicht verbunden: QR-Code am Fernseher neu scannen.' : 'Not connected: scan the QR code on the TV again.'; }
        else msg.textContent = '';
      });
  }
  function flush() {
    if (sending) return;
    var events = queue; queue = [];
    if (dx || dy) { events.push({ t:'move', dx:dx, dy:dy }); dx = dy = 0; }
    if (sx || sy) { events.push({ t:'scroll', dx:sx, dy:sy }); sx = sy = 0; }
    if (!events.length) return;
    sending = true;
    post(events).catch(function () {
      msg.textContent = de ? 'Keine Verbindung zum Fernseher.' : 'No connection to the TV.';
    }).then(function () { sending = false; if (queue.length || dx || dy || sx || sy) flush(); });
  }
  function send(e) { queue.push(e); flush(); }
  setInterval(flush, 30);

  // Touchpad: one finger moves the pointer, a tap clicks, two fingers scroll.
  var pad = document.getElementById('pad');
  var points = {};
  var start = null, moved = 0, maxFingers = 0;
  var speed = 2.2;
  pad.addEventListener('pointerdown', function (e) {
    pad.setPointerCapture(e.pointerId);
    points[e.pointerId] = { x:e.clientX, y:e.clientY };
    var n = Object.keys(points).length;
    maxFingers = Math.max(maxFingers, n);
    if (n === 1) { start = Date.now(); moved = 0; maxFingers = 1; }
  });
  pad.addEventListener('pointermove', function (e) {
    var p = points[e.pointerId];
    if (!p) return;
    var mx = e.clientX - p.x, my = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(mx) + Math.abs(my);
    var n = Object.keys(points).length;
    if (n >= 2) { sx += mx / n; sy += my / n; }
    else {
      // Faster finger movements cover more ground.
      var v = Math.sqrt(mx * mx + my * my);
      var f = speed * (1 + Math.min(v, 30) / 15);
      dx += mx * f; dy += my * f;
    }
  });
  function up(e) {
    if (!points[e.pointerId]) return;
    delete points[e.pointerId];
    if (Object.keys(points).length === 0) {
      if (start && Date.now() - start < 300 && moved < 12) send({ t: maxFingers >= 2 ? 'back' : 'tap' });
      start = null;
    }
  }
  pad.addEventListener('pointerup', up);
  pad.addEventListener('pointercancel', up);

  document.querySelectorAll('[data-nav]').forEach(function (b) {
    b.addEventListener('click', function () { send({ t:'nav', v:b.dataset.nav }); });
  });
  document.querySelectorAll('[data-dpad]').forEach(function (b) {
    b.addEventListener('click', function () { send({ t:'dpad', v:b.dataset.dpad }); });
  });
  document.querySelectorAll('[data-key]').forEach(function (b) {
    b.addEventListener('click', function () { send({ t:'key', v:b.dataset.key }); });
  });
  var text = document.getElementById('text');
  var address = document.getElementById('address');
  var editingAddress = false;
  address.addEventListener('focus', function () { editingAddress = true; address.select(); });
  address.addEventListener('blur', function () { editingAddress = false; });
  document.getElementById('addressForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = address.value.trim();
    if (!v) return;
    send({ t:'url', v:v });
    address.blur();
    window.scrollTo(0, 0);
  });
  document.getElementById('textForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!text.value) return;
    send({ t:'text', v:text.value });
    text.value = '';
  });

  function state() {
    fetch('/s?k=' + encodeURIComponent(key)).then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
      dot.className = s ? 'on' : '';
      if (s) {
        page.textContent = s.title || s.url || '';
        if (!editingAddress && s.url && s.url !== 'about:blank') address.value = s.url;
      }
    }).catch(function () { dot.className = ''; });
  }
  state();
  setInterval(state, 1500);
})();
</script>
</body>
</html>
