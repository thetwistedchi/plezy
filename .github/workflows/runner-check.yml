name: Runner check

# Starts a trivial job on several runner images to see which ones come up.
on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: uname -a && sw_vers 2>/dev/null || true
